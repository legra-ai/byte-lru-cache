[package]
name = "byte-lru-cache"
version = "0.1.1"
description = "Thread-safe LRU caching governed by an explicit byte budget"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/byte-lru-cache"
documentation = "https://docs.rs/byte-lru-cache"
readme = "README.md"
build = "build.rs"
keywords = ["cache", "lru", "memory", "bounded", "concurrency"]
categories = ["caching", "data-structures", "concurrency"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "build.rs",
    "src/**/*.rs",
    "tests/**/*.rs",
]

[dependencies]
lru = "0.18"
memory-budget = { version = "0.1", optional = true }

[features]
# Implements `memory_budget::Resizable` for `ByteLruCache` so a process
# memory governor can reapportion the cache's byte ceiling directly.
memory-budget = ["dep:memory-budget"]

[build-dependencies]
rhusky = "0.0.6"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
